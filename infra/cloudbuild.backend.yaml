# 백엔드: 테스트 → 이미지 빌드 → Artifact Registry 푸시 → Cloud Run(travel-api, 비공개) 배포
# 트리거(infra/create-triggers.sh)가 backend/** 변경 때 실행한다. 수동 실행: gcloud builds submit --config infra/cloudbuild.backend.yaml .
substitutions:
  _REGION: asia-northeast3
  _AR_REPO: travel
  _SERVICE: travel-api
  _DB_INSTANCE: travel-db
  _API_SA: travel-api-sa
  _WEB_SA: travel-web-sa
  _MAX_INSTANCES: "3"          # 비용 상한(동시에 뜨는 인스턴스 수)
  _RATE_PER_MINUTE: "8"        # 사용자별 분당 요청 한도
  _RATE_PER_DAY: "150"         # 사용자별 일일 요청 한도
  _IP_RATE_PER_MINUTE: "30"    # IP별 분당 요청 한도

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: python:3.12-slim
    dir: backend
    entrypoint: bash
    args:
      - -c
      - pip install --no-cache-dir -r requirements-dev.txt && pytest

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID", "backend"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # 셸 변수는 Cloud Build 치환과 겹치지 않게 $$ 로 쓴다.
        SECRETS="OPENAI_API_KEY=OPENAI_API_KEY:latest,KAKAO_REST_API_KEY=KAKAO_REST_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest"
        ENVS="TRUST_CLIENT_IP_HEADER=true,RATE_LIMIT_PER_MINUTE=${_RATE_PER_MINUTE},RATE_LIMIT_PER_DAY=${_RATE_PER_DAY},IP_RATE_LIMIT_PER_MINUTE=${_IP_RATE_PER_MINUTE}"
        # LangSmith 키 값이 시크릿에 있을 때만 트레이싱을 켠다
        if gcloud secrets versions list LANGSMITH_API_KEY --limit 1 --format='value(name)' 2>/dev/null | grep -q .; then
          SECRETS="$$SECRETS,LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest"
          ENVS="$$ENVS,LANGSMITH_PROJECT=travel-chatbot"
        fi
        gcloud run deploy ${_SERVICE} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID \
          --region ${_REGION} \
          --service-account ${_API_SA}@$PROJECT_ID.iam.gserviceaccount.com \
          --no-allow-unauthenticated \
          --add-cloudsql-instances $PROJECT_ID:${_REGION}:${_DB_INSTANCE} \
          --set-secrets "$$SECRETS" \
          --set-env-vars "$$ENVS" \
          --min-instances 0 --max-instances ${_MAX_INSTANCES} \
          --cpu 1 --memory 512Mi --concurrency 20 --timeout 300 \
          --quiet
        # 웹 서비스 계정만 이 백엔드를 호출할 수 있게 한다(이미 있으면 그대로 둔다)
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region ${_REGION} \
          --member "serviceAccount:${_WEB_SA}@$PROJECT_ID.iam.gserviceaccount.com" \
          --role roles/run.invoker --quiet
